name: Release

# A GitHub release is created from every pushed v* tag; its notes are the annotated tag message.
# actions/checkout fetches a pushed tag as a lightweight ref (the commit message, not the tag message),
# so the tag is fetched again explicitly before reading it.
# A push to main that changes this file re-writes the notes of every existing v* release from its tag
# (without touching which release is "latest") — it repairs notes written by an earlier version of it.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the annotated tags
        run: git fetch --force --tags origin
      - name: Create or update the GitHub release of a pushed tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          git for-each-ref "refs/tags/${tag}" --format='%(contents)' > notes.md
          if [ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ] || [ ! -s notes.md ]; then echo "ProstoCAM ${tag}" > notes.md; fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --notes-file notes.md --latest
          else
            gh release create "${tag}" --title "ProstoCAM ${tag#v}" --notes-file notes.md --latest
          fi
      - name: Re-write the notes of existing releases from their tags
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag -l 'v*'); do
            [ "$(git cat-file -t "refs/tags/${tag}")" = "tag" ] || continue
            gh release view "${tag}" >/dev/null 2>&1 || continue
            git for-each-ref "refs/tags/${tag}" --format='%(contents)' > notes.md
            [ -s notes.md ] || continue
            gh release edit "${tag}" --notes-file notes.md
            echo "notes of ${tag} re-written"
          done
