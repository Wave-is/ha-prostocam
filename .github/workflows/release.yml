name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes from the annotated tag
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > notes.md
          if [ ! -s notes.md ]; then echo "ProstoCAM ${GITHUB_REF_NAME}" > notes.md; fi
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md --latest
          else
            gh release create "${GITHUB_REF_NAME}" --title "ProstoCAM ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
          fi
