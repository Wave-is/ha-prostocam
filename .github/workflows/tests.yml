name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # 3.14: the newest Home Assistant; 3.13: the last releases that still run on it.
        python: ["3.14", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          set -o pipefail
          pip install -r requirements_test.txt 2>&1 | tee pip.log
          versions="$(pip freeze | grep -iE '^(homeassistant|pytest-homeassistant-custom-component)==' | tr '\n' ' ')"
          echo "$versions"
          echo "::notice title=Versions::$versions"
      - name: Run
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee pytest.log
      - name: Coverage summary
        if: always()
        run: |
          # The coverage table as an annotation (readable without signing in).
          if [ ! -f pytest.log ]; then exit 0; fi
          sed -n '/coverage: platform/,/^TOTAL/p' pytest.log | grep -vE '^-+$' > coverage.txt || true
          total="$(grep '^TOTAL' coverage.txt | awk '{print $NF}')"
          echo "::notice title=Coverage ${total}::$(sed -e 's/%/%25/g' coverage.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')"
      - name: Failure summary
        if: failure()
        run: |
          # Annotations are readable without signing in; the log is not.
          if [ ! -f pytest.log ]; then cp pip.log pytest.log 2>/dev/null || exit 0; fi
          grep -E '^(FAILED|ERROR)|Error|error:' pytest.log | head -n 40 > summary.txt || true
          tail -n 120 pytest.log >> summary.txt
          message="$(sed -e 's/%/%25/g' summary.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=pytest tail::${message}"
