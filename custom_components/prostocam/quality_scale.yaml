# Integration Quality Scale of ProstoCAM, rule by rule (target: Gold).
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
rules:
  # ------------------------------------------------------------------ Bronze
  action-setup:
    status: done
    comment: Services are registered in async_setup, once for every connection.
  appropriate-polling:
    status: done
    comment: >-
      Push first (the event channel /v2/stream); the camera catalog every 5 min,
      the account every 15 min, mute every 5 min, deterrence once a day, as the
      server asks (contract §8.2, §11.5).
  brands:
    status: todo
    comment: The icon is not in home-assistant/brands yet (custom_integrations).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirements; the client is part of the integration (api.py).
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: done
    comment: Event entities, the events prostocam_alarm, prostocam_ai_verdict, prostocam_export_ready (README).
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: >-
      The token is checked by the first heartbeat (a refusal starts reauth). A
      server that can not be reached does not stop the start on purpose: sensor
      events of Home Assistant are queued and sent later (contract §6).
  unique-config-entry: done

  # ------------------------------------------------------------------ Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: pytest --cov in CI, fails under 95 % (tests.yml, pyproject.toml).

  # -------------------------------------------------------------------- Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud service paired with a code; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # ---------------------------------------------------------------- Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
